<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070a12" />
    <meta name="description" content="Prism Pact — Match-3 PvP với draft trực tiếp trên Avalanche" />
    <title>Prism Pact — Đấu Trường Match-3</title>
    <style>
      :root {
        --bg: #04060b;
        --frame: #070a12;
        --border: #243249;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --accent: #2dd4bf;
        --danger: #f87171;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }

      * { box-sizing: border-box; }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(circle at 50% 20%, #101726 0%, var(--bg) 60%, #020306 100%);
        color: var(--text);
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
      }

      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: var(--bg);
      }

      #game-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: var(--bg);
      }

      #app {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        touch-action: none;
      }

      #app canvas {
        display: block;
        box-shadow: 0 0 50px rgba(0, 0, 0, 0.85), 0 0 1px rgba(45, 212, 191, 0.2);
        image-rendering: auto;
      }

      .pp-input-wrapper {
        width: 388px;
        height: 46px;
        margin: 0;
        padding: 0;
        display: block;
      }

      .pp-input {
        width: 388px;
        height: 46px;
        padding: 0 16px;
        border-radius: 12px;
        border: 1.5px solid #2b3a55;
        background: #0d1523;
        color: var(--text);
        font: 600 15px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        letter-spacing: 0.3px;
        outline: none;
        box-sizing: border-box;
        transition: border-color 140ms ease, box-shadow 140ms ease;
        -webkit-appearance: none;
      }

      .pp-input::placeholder { color: #64748b; font-weight: 500; }

      .pp-input:focus {
        border-color: rgba(45, 212, 191, 0.95);
        box-shadow: 0 0 0 3px rgba(45, 212, 191, 0.22);
      }

      #offline-banner {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 50;
        display: none;
        align-items: center;
        gap: 12px;
        padding: 10px 18px;
        border: 1px solid rgba(248, 113, 113, 0.55);
        border-radius: 12px;
        background: rgba(38, 13, 19, 0.96);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(8px);
        font-size: 13px;
        font-weight: 600;
        line-height: 1.3;
      }

      #offline-banner.visible { display: flex; }

      #offline-banner .dot {
        flex: 0 0 auto;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--danger);
        box-shadow: 0 0 10px var(--danger);
        animation: pp-pulse 1.2s ease-in-out infinite;
      }

      #offline-banner span { flex: 1 1 auto; color: #fecaca; }

      #offline-banner button {
        flex: 0 0 auto;
        border: 1px solid rgba(248, 113, 113, 0.6);
        border-radius: 8px;
        background: rgba(248, 113, 113, 0.16);
        color: #fee2e2;
        font: 700 12px/1 inherit;
        padding: 7px 12px;
        cursor: pointer;
      }

      #offline-banner button:hover { background: rgba(248, 113, 113, 0.28); }
      #offline-banner button:active { transform: scale(0.97); }

      @keyframes pp-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div id="app"></div>
      <div id="offline-banner" role="status" aria-live="polite">
        <i class="dot"></i>
        <span id="offline-text">Không kết nối được server</span>
        <button id="offline-retry" type="button">Thử lại</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
